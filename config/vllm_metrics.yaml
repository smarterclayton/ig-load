apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: vllm-metrics
spec:
  selector:
    matchLabels:
      server: vllm
  endpoints:
  - port: 8000
    interval: 10s
  targetLabels:
    fromPod:
    - from: app
    - from: component
    - from: llm-d.ai/role
      to: role
    - from: apps.kubernetes.io/pod-index
      to: pod_index
    metadata:
    - pod
    - container
    - node
    #- namespace
    - top_level_controller_name
    - top_level_controller_type
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: llm-d-metrics
spec:
  selector:
    matchLabels:
      llm-d.ai/inferenceServing: "true"
  endpoints:
  - port: 8000
    interval: 10s
  targetLabels:
    fromPod:
    - from: app
    - from: component
    - from: llm-d.ai/role
      to: role
    - from: apps.kubernetes.io/pod-index
      to: pod_index
    metadata:
    - pod
    - container
    - node
    #- namespace
    - top_level_controller_name
    - top_level_controller_type
