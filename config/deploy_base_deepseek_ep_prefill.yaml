apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
    name: vllm-deepseek-ep-prefill
    annotations:
      # For better performance on small EP sizes (<=32) it may be desirable to
      # have LWS exclusively schedule onto the sub block. At the current time
      # expert parallel deployment has not been shown to require sub block
      # placement for peak performance and so it is disabled here to reduce
      # failures to schedule in test and development environments.
      #
      # leaderworkerset.sigs.k8s.io/exclusive-topology: cloud.google.com/gce-topology-subblock
spec:
    replicas: 1
    leaderWorkerTemplate:
        size: 2
        restartPolicy: None #RecreateGroupOnPodRestart

        workerTemplate:
            metadata:
              labels:
                app: vllm-deepseek-ep
                component: vllm-deepseek-ep-prefill
                llm-d.ai/role: prefill
                server: vllm
              annotations:
                networking.gke.io/default-interface: 'eth0'
                networking.gke.io/interfaces: |
                  [
                    {"interfaceName":"eth0","network":"default"},
                    {"interfaceName":"eth2","network":"rdma-0"},
                    {"interfaceName":"eth3","network":"rdma-1"},
                    {"interfaceName":"eth4","network":"rdma-2"},
                    {"interfaceName":"eth5","network":"rdma-3"},
                    {"interfaceName":"eth6","network":"rdma-4"},
                    {"interfaceName":"eth7","network":"rdma-5"},
                    {"interfaceName":"eth8","network":"rdma-6"},
                    {"interfaceName":"eth9","network":"rdma-7"}
                  ]
            spec:
              # Prefer that all instances land in the same network sub block for
              # best performance.
              affinity:
                podAffinity:
                  # Subblock affinity cannot guarantee all pods in the replica
                  # are in the same subblock, but is better than random spreading
                  preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 2
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app: vllm-deepseek-ep
                      matchLabelKeys:
                      - component
                      topologyKey: cloud.google.com/gce-topology-block
                  - weight: 1
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app: vllm-deepseek-ep
                      matchLabelKeys:
                      - component
                      topologyKey: cloud.google.com/gce-topology-subblock

              containers:
              - name: vllm-worker
                image:
                  ghcr.io/llm-d/llm-d-cuda-dev@sha256:c2bcf0db71a082c774eb2574d56d727590c087fc6c91ede7868a14a31f549339
                  #gcr.io/claytoncoleman-gke-dev/github.com/smarterclayton/vllm-dp-lws:relesea-v0.11.0-20251015
                  #:main_20251023_nvshmem4py
                  #:relesea-v0.11.0-20251015
                imagePullPolicy: Always
                workingDir: /code
                command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  #trap "" SIGCHLD
                  echo Preparing vLLM
                  echo

                  # Create ~/.bashrc so that kubectl exec -- /bin/bash is ready to run
                  cat <<'EOF' > ~/.bashrc
                  #!/bin/bash

                  # Shell conveniences
                  if [[ $- == *i* ]]; then
                    bind '"\e[A":history-search-backward'
                    bind '"\e[B":history-search-forward'
                    shopt -s histappend
                    export HISTFILESIZE=1000000
                    export HISTSIZE=1000000
                    export HISTCONTROL=ignoreboth
                    shopt -s cmdhist
                  fi

                  # Ensure the container behaves consistently depending on which source image
                  if command -v apt-get >/dev/null 2>&1; then
                    export VLLM_HOME=/app/venv
                  else
                    # Assume we're using the RH midstream image
                    export VLLM_HOME=/opt/vllm
                  fi
                  export PATH=${VLLM_HOME}/bin:${PATH}:/usr/local/nvidia/bin:${PATH}:/usr/local/gib/bin

                  # Define dynamic start arguments from the leader worker set
                  export DP_SIZE=$((LWS_GROUP_SIZE * DP_SIZE_LOCAL))
                  export START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

                  # Start Qwen3 for a faster and simpler MoE test harness
                  function serve_simple {
                    ${VLLM_HOME}/bin/vllm serve Qwen/Qwen3-30B-A3B-FP8 --port ${PORT:-8000} --enforce-eager --disable-log-requests --enable-expert-parallel --tensor-parallel-size 1 --data-parallel-size 2 --trust-remote-code
                  }
                  function collect_vllm_env {
                    wget -O collect_env.py https://raw.githubusercontent.com/vllm-project/vllm/main/vllm/collect_env.py && VIRTUAL_ENV=/app/venv uv run collect_env.py
                  }
                  function print_stacks {
                    pgrep 'VLLM' | xargs -P8 -I {} gdb -p {} --batch --eval-command 'py-bt' | grep -v 'New LWP'
                  }
                  function print_cuda_stacks {
                    pgrep 'VLLM' | xargs -P8 -I {} cuda-gdb -p {} --batch --eval-command 'info cuda launch trace' | grep -v 'LWP'
                  }
                  function bench_decode_guide {
                    guidellm benchmark --target "http://${HOST:-${DEFAULT_HOST}}:${PORT:-8000}" \
                      --rate-type concurrent \
                      --max-requests "${NUM_PROMPTS:-$(( ${MAX_CONCURRENCY:-10} * 3))}" \
                      --rate "${MAX_CONCURRENCY:-10}" \
                      --data "{\"prompt_tokens\": ${TOKENS_IN:-1},
                                \"output_tokens\": ${TOKENS_OUT:-100},
                                \"output_tokens_stdev\": \"1\"}" \
                      --output-path "/tmp/out.json" \
                      --output-sampling 10
                  }
                  function profile_req {
                      local addr=localhost
                      curl "${addr}:${PORT:-8000}/start_profile" -X POST
                      sleep ${1:-3}
                      curl "${addr}:${PORT:-8000}/stop_profile" -X POST
                  }

                  # Define test scripts
                  export DEFAULT_HOST=vllm-deepseek-ep-decode
                  # Warmup the prefill server
                  function warmup_prefill {
                    TOKENS_IN=1000 TIMES=3 bench_prefill
                  }
                  # Run a benchmark against the decode servers
                  function bench_decode {
                    local headers; local port=${PORT:-8000}; if [[ -n "${DISAGG-}" ]]; then prefill_hosts="$( dig SRV +short +search vllm-deepseek-ep-prefill | cut -d ' ' -f 4 | sed 's/local\.$/local/' | sort | awk "{print \$1 \":${port}\"}" | paste -sd ', ' -)"; headers=" --header x-prefiller-host-port=${prefill_hosts} "; fi
                    local concurrency=${MAX_CONCURRENCY:-$(( DP_SIZE * 100 ))}
                    local prompts=${NUM_PROMPTS:-$(( concurrency * ${TIMES:-4} ))}
                    VLLM_LOGGING_LEVEL=WARNING vllm bench serve ${headers:-} --base-url http://${HOST:-${DEFAULT_HOST}}:${port} --model ${VLLM_MODEL} --dataset-name random --request-id-prefix "bench-${HOSTNAME}" --seed "$(date +%M%H%M%S)" --ignore-eos --random-input-len ${TOKENS_IN:-2} --random-output-len ${TOKENS_OUT:-100} --max-concurrency ${concurrency} --num-prompts ${prompts} --ready-check-timeout-sec 0 --disable-tqdm
                  }
                  # Run a benchmark against the prefill servers only
                  function bench_prefill {
                    MAX_CONCURRENCY=${MAX_CONCURRENCY:-$(( DP_SIZE * 5 / 2 ))} TOKENS_IN=${TOKENS_IN:-1000} TOKENS_OUT=${TOKENS_OUT:-1} DEFAULT_HOST=vllm-deepseek-ep-prefill DISAGG=0 bench_decode
                  }
                  # Run a benchmark against the default configuration
                  function bench {
                    TOKENS_IN=${TOKENS_IN:-1000} TOKENS_OUT=${TOKENS_OUT:-1000} DISAGG=1 bench_decode
                  }
                  function req {
                    unset prefiller; if [[ -n "${DISAGG-}" ]]; then prefiller="X-Prefiller-Host-Port: $( dig SRV +short +search vllm-deepseek-ep-prefill | cut -d ' ' -f 4 | sed 's/local\.$/local/' | sort | awk '{print $1 ":8000"}' | paste -sd ', ' -)"; fi
                    curl -i -H 'Content-Type: application/json' -H 'X-Request-Id: shell_req' -H "${prefiller-}" -d \
                      "{\"temperature\": 0,\"prompt\": \"Write as if you were a critic, and provide extensive details of the time you spent with the subject. Don't forget to provide personal anecdotes.\n\n: San Francisco\",\"max_tokens\": ${TOKENS_OUT:-100},\"model\": \"${VLLM_MODEL}\"}" "$@" \
                      "${HOST:-localhost}:${PORT:-8000}/v1/completions"
                  }

                  # Build and resolve the start command (allowing variables to be
                  # resolved in the container arguments)
                  serve=()
                  if [[ -n "${STRACE:-}" ]]; then
                    serve+=( strace ${STRACE} )
                  elif [[ -n "${GDB:-}" ]]; then
                    serve+=( gdb ${GDB} --args )
                  elif [[ -n "${NCU:-}" ]]; then
                    serve+=( ncu ${NCU} )
                  fi
                  serve+=( "$@" )
                  for i in "${!serve[@]}"; do if [[ "${serve[$i]}" == *'$'* ]]; then eval "serve[$i]=${serve[$i]}"; fi; done
                  serve[0]=$( which "${serve[0]}" )

                  EOF

                  # Drop the kernel cache if necessary
                  if [[ -n "${DROP_KERNEL_CACHE}" ]]; then
                    find /root/.nv/ComputeCache -mindepth 1 -delete
                  fi

                  # Debugging tools for the environment
                  if command -v apt-get >/dev/null 2>&1; then
                    # Using https://github.com/smarterclayton/vllm-dp-lws
                    # apt-get -qq update && apt-get install -y ?
                    echo
                  else
                    # Using https://github.com/llm-d/llm-d/tree/main/docker/Dockerfile.cuda
                    dnf install -qy gdb strace
                    curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR="/usr/local/bin/" sh
                    export VENV_PATH="/opt/vllm"
                    export PYTHON="${VENV_PATH}/bin/python"
                    export PATH="${VENV_PATH}/bin:${PATH}"
                    export CUDA_MAJOR=12 CUDA_MINOR=9 CUDA_PATCH=1
                    "${PYTHON}" -m ensurepip --upgrade
                    "${PYTHON}" -m pip install -U pip wheel setuptools
                  fi
                  echo

                  # Install dependencies that have a _BRANCH|_INSTALL variable set
                  components=( deepep deepgemm flashinfer vllm )
                  for script in "${components[@]}"; do
                    branch="${script^^}_BRANCH"
                    force="${script^^}_INSTALL"
                    if [[ -z "${!branch-}" && -z "${!force-}" ]]; then
                      continue
                    fi
                    for location in /init-scripts /install-scripts; do
                      if [[ -f ${location}/${script}.sh ]]; then
                        ${location}/${script}.sh
                        break
                      fi
                    done
                  done
                  echo
                  for script in "${components[@]}"; do
                    echo "${script} $( git -C "/app/${script}" log --oneline -1 2>&1 || true )"
                  done
                  echo

                  # Work around "unable to create ah" error
                  #if wheel="$( ls "${NVSHMEM_DIR:-${NVSHMEM_PREFIX}}"/lib/python/dist/nvshmem4py_cu"${CUDA_MAJOR}"-*-cp"${PYTHON_VERSION/./}"-cp"${PYTHON_VERSION/./}"-manylinux_*.whl | head -1 )"; then
                  #  VIRTUAL_ENV=/app/venv uv pip install "${wheel}"
                  #fi
                  VIRTUAL_ENV=/app/venv uv pip uninstall nvidia-nvshmem-cu${CUDA_MAJOR}
                  #VIRTUAL_ENV=/app/venv uv pip uninstall nvshmem4py-cu${CUDA_MAJOR}

                  env | sort

                  # If set, hold the container before launch to allow debugging
                  if [[ -n "${INTERACTIVE:-}" ]]; then
                    echo "Waiting for /code/launch to run vLLM"
                    while [[ ! -f /code/launch ]]; do
                      sleep 10
                    done
                    rm /code/launch
                  fi

                  source ~/.bashrc
                  set -x
                  # Clear /dev/shm on start to prevent running out of space when crashes occur
                  # https://github.com/llm-d/llm-d/issues/352
                  find /dev/shm -type f -delete
                  exec "${serve[@]}"
                - ""
                - vllm
                args:
                - serve
                - ${VLLM_MODEL}
                - --port=8000
                - --disable-log-requests
                - --data-parallel-hybrid-lb
                - --speculative-config=$(VLLM_SPECULATIVE_CONFIG)
                - --enable-dbo
                - --async-scheduling
                - --dbo-decode-token-threshold=32
                # try to keep 40GB free, https://github.com/vllm-project/vllm/issues/25597
                - --kv-cache-memory=63000000000
                - --enable-expert-parallel
                - --enable-eplb
                - --num-redundant-experts=$(( DP_SIZE * 2 ))
                - --eplb-window-size=100
                - --eplb-step-interval=100
                - --eplb-log-balancedness
                - --tensor-parallel-size=$TP_SIZE
                - --data-parallel-size=$DP_SIZE
                - --data-parallel-size-local=$DP_SIZE_LOCAL
                - --data-parallel-address=${LWS_LEADER_ADDRESS}
                - --data-parallel-rpc-port=5555
                - --data-parallel-start-rank=$START_RANK
                - --kv-transfer-config={"kv_connector":"NixlConnector", "kv_role":"kv_both"}
                - --trust-remote-code

                env:
                  - name: INTERACTIVE
                    value: ""
                  - name: DROP_KERNEL_CACHE
                    value: ""
                  # Configure default NCCL config for gIB
                  - name: BASH_ENV
                    value: /usr/local/gib/scripts/set_nccl_env.sh

                  # Use a GCP specific patch to force NVSHMEM to choose the
                  # NIC with the same index as the GPU for EP. Otherwise we
                  # only use 4 of the 8 NICs.
                  - name: DEEPEP_REPO_URL
                    value: https://github.com/smarterclayton/DeepEP.git
                  - name: DEEPEP_BRANCH
                    value: nic_pe_alignment
                  # Set to 1 when running from a branch close to vLLM HEAD to attempt to use cached artifacts
                  # - name: VLLM_USE_PRECOMPILED
                  #   value: "1"
                  # When building packages at runtime, ensure we are compiled for hopper and blackwell
                  - name: TORCH_CUDA_ARCH_LIST
                    value: "9.0a 10.0"

                  # NIXL Configuration
                  - name: VLLM_NIXL_SIDE_CHANNEL_PORT
                    value: "6555"
                  - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  # DeepEP / NVSHMEM configuration
                  # On GCP A3U and A4 machines, explicitly map GPUs by device id to NIC names
                  - name: DEEP_EP_DEVICE_TO_HCA_MAPPING
                    value: 0:mlx5_0:1,1:mlx5_1:1,2:mlx5_2:1,3:mlx5_3:1,4:mlx5_4:1,5:mlx5_5:1,6:mlx5_6:1,7:mlx5_7:1
                  # Force use of TCP for NIXL disaggregation
                  #- name: UCX_TLS
                  #  value: "tcp,cuda_copy"
                  #- name: UCX_NET_DEVICES
                  #  value: "eth0"
                  - name: NVSHMEM_REMOTE_TRANSPORT
                    value: "ibgda"
                  - name: NVSHMEM_IB_ENABLE_IBGDA
                    value: "true"
                  # We prefer to be GPU-initiated, and the GDRCopy mode requires a privileged device
                  # to be mounted into the container. Disable to prevent a warning message during
                  # startup.
                  - name: NVSHMEM_DISABLE_GDRCOPY
                    value: "true"
                  - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
                    value: "eth0"
                  - name: GLOO_SOCKET_IFNAME
                    value: "eth0"

                  # Debugging logging
                  - name: UCX_LOG_LEVEL
                    value: "info"
                  #- name: UCX_HANDLE_ERRORS
                  #  value: "freeze"
                  #- name: UCX_ERROR_SIGNALS
                  #  value: "SIGSEGV"
                  - name: NVSHMEM_INFO
                    value: "true"
                  - name: NVSHMEM_DEBUG
                    value: "INFO"
                  - name: NVSHMEM_DEBUG_SUBSYS
                    value: "ALL"
                  - name: NCCL_DEBUG
                    value: INFO # trace
                  - name: VLLM_LOGGING_LEVEL
                    value: "DEBUG"
                  - name: HF_HUB_DISABLE_PROGRESS_BARS
                    value: "1"
                  # Uncomment to trace the entire process
                  #- name: STRACE
                  #  value: "-f -o /tmp/strace.log"
                  - name: VLLM_DEBUG_ARGS
                    value: ""
                  # Uncomment to debug NCCL hangs or crashes
                  #- name: NCCL_BLOCKING_WAIT
                  #  value: "1"
                  # Uncomment to identify where CPP calls are crashing
                  #- name: TORCH_SHOW_CPP_STACKTRACES
                  #  value: "1"
                  # Uncomment to get more accurate crash traces
                  # - name: CUDA_LAUNCH_BLOCKING
                  #  value: "1"
                  # - name: CUDA_ENABLE_USER_TRIGGERED_COREDUMP
                  #   value: "1"
                  - name: VLLM_TORCH_PROFILER_DIR
                    value: "/code/traces"
                  # Disable GCP NCCL telemetry due to failures to upload blocking
                  # workload start
                  - name: NCCL_TELEMETRY_MODE
                    value: "0"

                  # The model and any specific config
                  - name: VLLM_MODEL
                    value: "deepseek-ai/DeepSeek-V3.1"
                    #value: "nvidia/DeepSeek-R1-FP4"
                  # Use this when running DeepSeek @ FP4
                  #- name: VLLM_USE_FLASHINFER_MOE_FP4
                  #  value: "1"

                  # vLLM performance tuning
                  - name: VLLM_USE_DEEP_GEMM
                    value: "1"
                  # Select an all2all backend optimized for latency or throughput
                  - name: VLLM_ALL2ALL_BACKEND
                    # value: "naive"
                    # value: "pplx"
                    value: "deepep_high_throughput"
                    # value: deepep_low_latency
                  - name: VLLM_ATTENTION_BACKEND
                    value: CUTLASS_MLA
                    #value: FLASHINFER_MLA
                    #value: TRITON_MLA
                  # Avoid known hangs with CUTLASS_MLA on B200 by forcing splits to be 1
                  - name: FORCE_NUM_KV_SPLITS
                    value: "1"
                  - name: TP_SIZE
                    value: "1"
                  - name: DP_SIZE_LOCAL
                    value: "8"
                  - name: VLLM_MOE_DP_CHUNK_SIZE
                    value: "5000"
                  - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
                    value: "1"
                  - name: VLLM_SPECULATIVE_CONFIG
                    value: "" #'{"method":"deepseek_mtp","num_speculative_tokens":1}'
                  # Remove a NCCL AllReduce getting in the way of async scheduling
                  - name: VLLM_DISABLE_NCCL_FOR_DP_SYNCHRONIZATION
                    value: "1"

                  # Consistent with upstream Dockerfile.cuda
                  - name: TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC
                    value: "15"
                  - name: TORCH_NCCL_DUMP_ON_TIMEOUT
                    value: "0"
                  # UCX mmap hooks cause memory leaks in a mistral fp8 model
                  - name: UCX_MEM_MMAP_HOOK_MODE
                    value: none

                  # Use cache directories from the mounted volume under one easy to mount
                  # root directory.
                  - name: CUDA_CACHE_PATH
                    value: /var/cache/vllm/cuda
                  - name: CCACHE_DIR
                    value: /var/cache/vllm/ccache
                  - name: VLLM_CACHE_ROOT
                    value: /var/cache/vllm/vllm
                  - name: FLASHINFER_WORKSPACE_BASE
                    value: /var/cache/vllm/flashinfer
                  - name: TRITON_CACHE_DIR
                    value: /var/cache/vllm/triton
                  - name: DG_JIT_CACHE_DIR
                    value: /var/cache/vllm/deepgemm
                  # HuggingFace is likely to be quite a bit larger, give it its own cache
                  - name: HF_HUB_CACHE
                    value: /var/cache/huggingface

                  # Mount secrets for loading images
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: llm-d-hf-token
                        key: HF_TOKEN
                        optional: true

                terminationMessagePolicy: FallbackToLogsOnError
                lifecycle:
                  preStop:
                    sleep:
                      seconds: 1
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 8000
                    scheme: HTTP
                  periodSeconds: 1
                  successThreshold: 1
                  failureThreshold: 1
                  timeoutSeconds: 1

                # may not be needed on GKE
                securityContext:
                  runAsUser: 0  # needed for RH image to be able to override files (runs as vllm)
                  # NVSHMEM IBGDA requires CAP_SYS_ADMIN or nvidia.ko to have PeerMappingOverride=1 set
                  # Since PeerMappingOverride allows workloads to potential impact each other on the
                  # same host, privileged is no less secure.
                  privileged: true # needed to open the host device for UAR ??
                  capabilities:
                    add:
                    - "IPC_LOCK"
                    - "SYS_RAWIO"
                resources:
                  limits:
                    ephemeral-storage: 3Ti
                    nvidia.com/gpu: "8"

                    networking.gke.io.networks/rdma-0: "1"
                    networking.gke.io.networks/rdma-0.IP: "1"
                    networking.gke.io.networks/rdma-1: "1"
                    networking.gke.io.networks/rdma-1.IP: "1"
                    networking.gke.io.networks/rdma-2: "1"
                    networking.gke.io.networks/rdma-2.IP: "1"
                    networking.gke.io.networks/rdma-3: "1"
                    networking.gke.io.networks/rdma-3.IP: "1"
                    networking.gke.io.networks/rdma-4: "1"
                    networking.gke.io.networks/rdma-4.IP: "1"
                    networking.gke.io.networks/rdma-5: "1"
                    networking.gke.io.networks/rdma-5.IP: "1"
                    networking.gke.io.networks/rdma-6: "1"
                    networking.gke.io.networks/rdma-6.IP: "1"
                    networking.gke.io.networks/rdma-7: "1"
                    networking.gke.io.networks/rdma-7.IP: "1"
                  requests:
                    cpu: 32
                    memory: 512Gi
                    ephemeral-storage: 3Ti
                    nvidia.com/gpu: "8"

                    networking.gke.io.networks/rdma-0: "1"
                    networking.gke.io.networks/rdma-0.IP: "1"
                    networking.gke.io.networks/rdma-1: "1"
                    networking.gke.io.networks/rdma-1.IP: "1"
                    networking.gke.io.networks/rdma-2: "1"
                    networking.gke.io.networks/rdma-2.IP: "1"
                    networking.gke.io.networks/rdma-3: "1"
                    networking.gke.io.networks/rdma-3.IP: "1"
                    networking.gke.io.networks/rdma-4: "1"
                    networking.gke.io.networks/rdma-4.IP: "1"
                    networking.gke.io.networks/rdma-5: "1"
                    networking.gke.io.networks/rdma-5.IP: "1"
                    networking.gke.io.networks/rdma-6: "1"
                    networking.gke.io.networks/rdma-6.IP: "1"
                    networking.gke.io.networks/rdma-7: "1"
                    networking.gke.io.networks/rdma-7.IP: "1"
                volumeMounts:
                  - name: shm
                    mountPath: /dev/shm
                  - name: init-scripts-volume
                    mountPath: /init-scripts
                  - name: hf-cache
                    mountPath: /var/cache/huggingface
                  - name: jit-cache
                    mountPath: /var/cache/vllm
                  - name: vllm
                    mountPath: /code
                  # Required to access the gIB configuration for NCCL on GKE
                  - mountPath: /usr/local/gib
                    name: gib

              volumes:
                # Volume for the init script from ConfigMap
                - name: init-scripts-volume
                  configMap:
                    name: vllm-init-scripts-config
                    defaultMode: 0755 # Set execute permissions for the script
                    optional: true
                # Needed for NCCL to function
                - name: shm
                  emptyDir:
                    medium: Memory
                    # Verified that we need about 2Gi to start on NCCL 2.27
                    sizeLimit: 3Gi
                # Use a cache directory across pods on the SSD to avoid redownloading large models
                - name: hf-cache
                  hostPath:
                    path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/vllm-hf-cache/
                    type: DirectoryOrCreate
                # Use a cache directory across pods on the SSD to avoid recompiling kernels
                # Note: there are occasionally bugs in compilation cache hashing that may trigger
                - name: jit-cache
                  hostPath:
                    path: /mnt/stateful_partition/kube-ephemeral-ssd/shared_disk/vllm-jit-cache/
                    type: DirectoryOrCreate
                # Necessary for gIB
                - name: gib
                  hostPath:
                    path: /home/kubernetes/bin/gib
                    type: ""
                # Scratch directory for the workload
                - name: vllm
                  emptyDir: {}
